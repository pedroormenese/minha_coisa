<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>

    <main>
        <h1 class="title baloo-tamma">
            I AM BETTER.
        </h1>
        <div class="time-container">
            <h2 class="flex fs-32 baloo-tamma">Anos: <p id="anos">0</p> </h2>
            <h2 class="flex fs-32 baloo-tamma">Meses: <p id="meses">0</p> </h2>
            <h2 class="flex fs-32 baloo-tamma">Semanas: <p id="semanas">0</p> </h2>
            <h2 class="flex fs-32 baloo-tamma">Dias: <p id="dias">0</p> </h2>
            <h2 class="flex fs-32 baloo-tamma">Minutos: <p id="minutos">0</p> </h2>
            <h2 class="flex fs-32 baloo-tamma">Segundos: <p id="segundos">0</p> </h2>
        </div>

        <div class="space-container">
            <button class="container1 fs-24 baloo-tamma" id="reset">
                RESETAR
            </button>
        </div>

        <div class="container2">
            <p class="fs-14 baloo-tamma">
                Quantidade de vezes que já resetou a sequência:
            </p>
            <p class="fs-128 baloo-tamma" id="contagem"></p>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
